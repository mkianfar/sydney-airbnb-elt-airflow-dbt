name: airbnb_elt
version: "1.0.0"
config-version: 2

profile: airbnb_elt
require-dbt-version: [">=1.10.0"] # tests use the `arguments:` property

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

# Folder names are lower-case on purpose: dbt matches these keys to folders case-sensitively on Linux.
models:
  airbnb_elt:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
      marts:
        +materialized: view
